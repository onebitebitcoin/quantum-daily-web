<meta charset="utf-8">
<title>__PAGE_TITLE__</title>
<style>
  @font-face {
    font-family: 'Card Display';
    src: url(data:font/woff2;base64,__FONT_DISPLAY_B64__) format('woff2');
    font-weight: 400 900;
    font-display: swap;
    unicode-range: U+0000-00FF, U+2000-206F, U+2190-2199;
  }
  @font-face {
    font-family: 'Card Text';
    src: url(data:font/woff2;base64,__FONT_TEXT_B64__) format('woff2');
    font-weight: 300 700;
    font-display: swap;
    unicode-range: U+0000-00FF, U+2000-206F, U+2190-2199;
  }

  __THEME_CSS__

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overscroll-behavior: none;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Card Text', 'Apple SD Gothic Neo', 'Pretendard Variable', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .app {
    position: relative; height: 100dvh; width: 100vw;
    background:
      radial-gradient(ellipse 70% 50% at 18% 8%, var(--glow), transparent 55%),
      radial-gradient(ellipse 60% 40% at 85% 92%, var(--glow), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  }

  /* ---------- progress ---------- */
  .progress-bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 6;
    display: flex; gap: 4px; padding: 14px 16px 0;
  }
  .progress-bar i {
    flex: 1; height: 3px; border-radius: 2px; background: var(--seg-off);
    cursor: pointer; overflow: hidden; position: relative;
  }
  .progress-bar i b {
    display: block; height: 100%; width: 0%; background: var(--accent);
    transition: width 0.25s ease;
  }
  .progress-bar i.done b { width: 100%; }

  .topline {
    position: absolute; top: 26px; left: 0; right: 0; z-index: 6;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
  }
  .brand {
    font-family: 'Card Display', sans-serif; font-weight: 700; letter-spacing: 0.04em;
    font-size: 13px; color: var(--accent-strong); text-transform: uppercase;
  }
  .counter {
    font-family: 'Card Text', monospace; font-size: 12px; letter-spacing: 0.04em;
    color: rgba(255,255,255,0.55); font-variant-numeric: tabular-nums;
  }
  :root[data-theme="light"] .counter, @media (prefers-color-scheme: light) { .counter { color: var(--ink-dim); } }

  /* ---------- track (snap scroller) ---------- */
  .track {
    height: 100%; width: 100%; display: flex; overflow-x: auto;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .track::-webkit-scrollbar { display: none; }

  .slide {
    flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always;
    display: flex; align-items: center; justify-content: center;
    padding: 78px 20px 92px;
  }

  .card {
    position: relative; width: 100%; max-width: 400px;
    max-height: min(680px, 82dvh);
    display: flex; flex-direction: column;
    background: var(--paper2); border-radius: 20px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45), 0 2px 0 rgba(255,255,255,0.03) inset;
    overflow: hidden;
    opacity: 0.5; transform: scale(0.92);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .slide.is-active .card { opacity: 1; transform: scale(1); }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; opacity: 1; transform: none; }
  }

  .card-scroll { overflow-y: auto; flex: 1; min-height: 0; }
  .card-inner { padding: 22px 22px 26px; display: flex; flex-direction: column; gap: 14px; }

  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-num {
    font-family: 'Card Display', sans-serif; font-weight: 700; font-size: 15px;
    color: var(--ink-dim); font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
  }
  .badge {
    font-family: 'Card Text', monospace; font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-dim); border: 1px solid var(--line);
    padding: 2px 7px; border-radius: 2px; white-space: nowrap;
  }
  .badge.emph-a { color: var(--accent2); border-color: var(--accent2); font-weight: 700; }
  .badge.emph-b { color: var(--accent-strong); border-color: var(--accent-strong); font-weight: 700; background: var(--glow); }

  .art {
    position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px;
    overflow: hidden; background: #0a0b0c;
  }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.9; }
  .art.is-link { cursor: pointer; }
  .art-badge {
    position: absolute; right: 8px; bottom: 8px; display: flex; align-items: center; gap: 5px;
    background: rgba(10,11,12,0.72); color: #f2ede0; font-family: 'Card Text', monospace;
    font-size: 10px; letter-spacing: 0.04em; padding: 4px 8px 4px 6px; border-radius: 20px;
  }
  .art-badge .tri {
    width: 0; height: 0; border-style: solid; border-width: 5px 0 5px 8px;
    border-color: transparent transparent transparent var(--accent);
  }
  .art-blank {
    display: flex; align-items: center; justify-content: center;
    font-family: 'Card Display', sans-serif; font-weight: 800; font-size: 56px;
    color: var(--accent-strong); background: #0d0e11; opacity: 0.9;
    text-shadow: 0 0 30px var(--glow);
  }

  .titles { display: flex; flex-direction: column; gap: 2px; }
  .titles .primary { font-size: 21px; font-weight: 700; line-height: 1.28; color: var(--ink); text-wrap: balance; }
  .titles .secondary { font-size: 12px; color: var(--ink-dim); font-weight: 500; }

  .chips-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips-row .cl {
    font-family: 'Card Text', monospace; font-size: 10px; color: var(--ink-dim);
    align-self: center; letter-spacing: 0.06em;
  }
  .chip {
    font-family: 'Card Text', monospace; font-size: 10.5px;
    background: var(--chip-bg); border: 1px dashed var(--line); color: var(--ink-dim);
    padding: 3px 7px; border-radius: 3px; white-space: nowrap;
  }

  .body-text { font-size: 14px; line-height: 1.68; color: var(--ink); margin: 0; }
  .pull {
    margin: 0; padding-left: 12px; border-left: 2px solid var(--accent);
    font-style: italic; font-weight: 600; font-size: 12.5px; color: var(--accent2); line-height: 1.5;
  }

  .link-cta {
    display: inline-flex; align-items: center; gap: 7px; align-self: flex-start;
    font-family: 'Card Text', monospace; font-size: 11.5px; letter-spacing: 0.03em;
    color: var(--ink); text-decoration: none; border: 1px solid var(--line);
    padding: 7px 12px; border-radius: 20px; background: var(--chip-bg);
  }
  .link-cta:hover, .link-cta:focus-visible { border-color: var(--accent); color: var(--accent2); }
  .link-cta .tri {
    width: 0; height: 0; border-style: solid; border-width: 5px 0 5px 8px;
    border-color: transparent transparent transparent var(--accent2);
  }

  /* cover / closing variants */
  .card.is-cover, .card.is-closing { align-items: center; text-align: center; }
  .card.is-cover .card-inner, .card.is-closing .card-inner { align-items: center; padding-top: 34px; }
  .cover-mark {
    font-family: 'Card Display', sans-serif; font-weight: 800; font-size: 46px;
    line-height: 0.9; color: var(--ink); margin: 0;
  }
  .cover-mark em { font-style: normal; color: var(--accent2); }
  .cover-meta {
    font-family: 'Card Text', monospace; font-size: 11px; color: var(--ink-dim);
    letter-spacing: 0.04em; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    margin: 0;
  }
  .cover-meta span:not(:last-child)::after { content: '·'; margin-left: 8px; color: var(--accent2); }
  .cover-hint {
    margin-top: 6px; font-size: 12px; color: var(--ink-dim);
    display: flex; align-items: center; gap: 6px;
  }
  .cover-hint .sw { display: inline-flex; gap: 3px; }
  .cover-hint .sw span {
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
    animation: sw 1.4s ease-in-out infinite;
  }
  .cover-hint .sw span:nth-child(2) { animation-delay: 0.15s; }
  .cover-hint .sw span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes sw { 0%,100% { opacity: 0.25; transform: translateX(0); } 50% { opacity: 1; transform: translateX(3px); } }
  @media (prefers-reduced-motion: reduce) { .cover-hint .sw span { animation: none; opacity: 0.7; } }

  .totals { width: 100%; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 12px; }
  .trow {
    display: flex; justify-content: space-between; font-family: 'Card Text', monospace;
    font-size: 12px; padding: 5px 0; border-bottom: 1px dotted var(--line); color: var(--ink-dim);
  }
  .trow b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .stamp {
    margin-top: 14px; font-family: 'Card Display', sans-serif; font-weight: 700; font-size: 12px;
    letter-spacing: 0.08em; color: var(--accent2); border: 2px solid var(--accent2);
    padding: 6px 14px; border-radius: 3px; transform: rotate(-3deg); display: inline-block;
  }
  .restart {
    margin-top: 16px; font-family: 'Card Text', monospace; font-size: 12px;
    color: var(--ink-dim); background: none; border: 1px solid var(--line); cursor: pointer;
    padding: 8px 14px; border-radius: 20px;
  }
  .restart:hover, .restart:focus-visible { color: var(--accent2); border-color: var(--accent2); }
  .src-list { text-align: left; font-size: 10.5px; color: var(--ink-dim); line-height: 1.8; width: 100%; }
  .src-list a { color: var(--ink-dim); }
  .src-list a:hover { color: var(--accent2); }

  /* ---------- nav arrows ---------- */
  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 6;
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18);
    background: rgba(15,16,18,0.5); color: #f2ede0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .nav-btn:hover, .nav-btn:focus-visible { border-color: var(--accent); background: var(--glow); }
  .nav-btn[disabled] { opacity: 0.25; pointer-events: none; }
  .nav-btn.prev { left: 14px; }
  .nav-btn.next { right: 14px; }
  .nav-btn svg { width: 18px; height: 18px; }
  @media (max-width: 560px) { .nav-btn { width: 36px; height: 36px; } }

  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<div class="app">
  <div class="progress-bar" id="progressBar"></div>
  <div class="topline">
    <span class="brand" id="brandLabel"></span>
    <span class="counter" id="counter">01 / 01</span>
  </div>

  <button class="nav-btn prev" id="prevBtn" aria-label="이전 카드" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button class="nav-btn next" id="nextBtn" aria-label="다음 카드" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>

  <div class="track" id="track"></div>
</div>

<script>
(function () {
  var MEDIA = __MEDIA_JSON__;
  var CONTENT = __CONTENT_JSON__;
  var BRAND = CONTENT.brand;
  var COVER = CONTENT.cover;
  var CARDS = CONTENT.cards;
  var CLOSING = CONTENT.closing;

  var track = document.getElementById('track');
  var progressBar = document.getElementById('progressBar');
  var counter = document.getElementById('counter');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.getElementById('brandLabel').textContent = BRAND;

  var TOTAL = CARDS.length + 2; // cover + cards + closing
  var slides = [];

  function makeSlide(className) {
    var s = document.createElement('div');
    s.className = 'slide';
    s.setAttribute('role', 'group');
    var card = document.createElement('div');
    card.className = 'card' + (className ? ' ' + className : '');
    s.appendChild(card);
    return { slide: s, card: card };
  }

  function buildCover() {
    var m = makeSlide('is-cover');
    var inner = document.createElement('div');
    inner.className = 'card-inner';
    inner.innerHTML =
      '<span class="badge">' + COVER.eyebrow + '</span>' +
      '<h1 class="cover-mark">' + COVER.mark.join('<br>') + '</h1>' +
      '<p class="cover-meta">' + COVER.meta.map(function (x) { return '<span>' + x + '</span>'; }).join('') + '</p>' +
      '<div class="cover-hint">' + COVER.hint + ' <span class="sw"><span></span><span></span><span></span></span></div>';
    m.card.appendChild(inner);
    return m.slide;
  }

  function buildCardSlide(t) {
    var m = makeSlide(null);
    var scroller = document.createElement('div');
    scroller.className = 'card-scroll';
    var inner = document.createElement('div');
    inner.className = 'card-inner';

    var head = document.createElement('div');
    head.className = 'card-head';
    var num = document.createElement('span');
    num.className = 'card-num';
    num.textContent = String(t.num).padStart(2, '0') + ' / ' + CARDS.length;
    head.appendChild(num);
    if (t.chip) {
      var badge = document.createElement('span');
      badge.className = 'badge' + (t.chip.emphasis === 'primary' ? ' emph-a' : t.chip.emphasis === 'secondary' ? ' emph-b' : '');
      badge.textContent = t.chip.text;
      head.appendChild(badge);
    }
    inner.appendChild(head);

    if (t.media) {
      var src = t.media.image && MEDIA[t.media.image];
      if (src) {
        var art = t.media.href ? document.createElement('a') : document.createElement('div');
        art.className = 'art' + (t.media.href ? ' is-link' : '');
        if (t.media.href) { art.href = t.media.href; art.target = '_blank'; art.rel = 'noopener'; }
        var img = document.createElement('img');
        img.src = src;
        img.alt = t.title;
        img.loading = 'lazy';
        art.appendChild(img);
        if (t.media.href && t.media.cta) {
          var artBadge = document.createElement('span');
          artBadge.className = 'art-badge';
          artBadge.innerHTML = '<span class="tri"></span>' + t.media.cta;
          art.appendChild(artBadge);
        }
        inner.appendChild(art);
      } else {
        var blank = document.createElement('div');
        blank.className = 'art art-blank';
        blank.textContent = String(t.num).padStart(2, '0');
        inner.appendChild(blank);
      }
    }

    var titles = document.createElement('div');
    titles.className = 'titles';
    var primary = document.createElement('div');
    primary.className = 'primary';
    primary.textContent = t.title;
    titles.appendChild(primary);
    if (t.subtitle) {
      var secondary = document.createElement('div');
      secondary.className = 'secondary';
      secondary.textContent = t.subtitle;
      titles.appendChild(secondary);
    }
    inner.appendChild(titles);

    if (t.chips && t.chips.length) {
      var cr = document.createElement('div');
      cr.className = 'chips-row';
      if (t.chips_label) {
        var cl = document.createElement('span');
        cl.className = 'cl';
        cl.textContent = t.chips_label;
        cr.appendChild(cl);
      }
      t.chips.forEach(function (c) {
        var chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = c;
        cr.appendChild(chip);
      });
      inner.appendChild(cr);
    }

    var body = document.createElement('p');
    body.className = 'body-text';
    body.textContent = t.body;
    inner.appendChild(body);

    if (t.quote) {
      var q = document.createElement('p');
      q.className = 'pull';
      q.textContent = '“' + t.quote + '”';
      inner.appendChild(q);
    }

    if (t.link) {
      var s = document.createElement('a');
      s.className = 'link-cta';
      s.href = t.link.href;
      s.target = '_blank';
      s.rel = 'noopener';
      s.innerHTML = '<span class="tri"></span>' + t.link.label;
      inner.appendChild(s);
    }

    scroller.appendChild(inner);
    m.card.appendChild(scroller);
    return m.slide;
  }

  function buildClosing() {
    var m = makeSlide('is-closing');
    var inner = document.createElement('div');
    inner.className = 'card-inner';

    var head = document.createElement('span');
    head.className = 'badge';
    head.textContent = CLOSING.eyebrow;
    inner.appendChild(head);

    var mark = document.createElement('h2');
    mark.className = 'cover-mark';
    mark.style.fontSize = '30px';
    var lines = CLOSING.mark_lines;
    mark.innerHTML = lines.slice(0, -1).map(function (l) { return l + '<br>'; }).join('') + '<em>' + lines[lines.length - 1] + '</em>';
    inner.appendChild(mark);

    var totalsEl = document.createElement('div');
    totalsEl.className = 'totals';
    CLOSING.rows.forEach(function (row) {
      var r = document.createElement('div');
      r.className = 'trow';
      var k = document.createElement('span');
      k.textContent = row[0];
      var v = document.createElement('b');
      v.textContent = row[1];
      r.appendChild(k);
      r.appendChild(v);
      totalsEl.appendChild(r);
    });
    inner.appendChild(totalsEl);

    var stamp = document.createElement('span');
    stamp.className = 'stamp';
    stamp.textContent = CLOSING.stamp;
    inner.appendChild(stamp);

    var restartBtn = document.createElement('button');
    restartBtn.className = 'restart';
    restartBtn.type = 'button';
    restartBtn.textContent = CLOSING.restart;
    restartBtn.addEventListener('click', function () { goTo(0); });
    inner.appendChild(restartBtn);

    if (CLOSING.sources && CLOSING.sources.length) {
      var srcList = document.createElement('div');
      srcList.className = 'src-list';
      srcList.appendChild(document.createTextNode('출처 — '));
      CLOSING.sources.forEach(function (src, i) {
        var a = document.createElement('a');
        a.href = src.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = src.label;
        srcList.appendChild(a);
        if (i < CLOSING.sources.length - 1) srcList.appendChild(document.createTextNode(' · '));
      });
      inner.appendChild(srcList);
    }

    m.card.appendChild(inner);
    return m.slide;
  }

  var frag = document.createDocumentFragment();
  var coverSlide = buildCover();
  frag.appendChild(coverSlide);
  slides.push(coverSlide);
  CARDS.forEach(function (t) {
    var s = buildCardSlide(t);
    frag.appendChild(s);
    slides.push(s);
  });
  var closingSlide = buildClosing();
  frag.appendChild(closingSlide);
  slides.push(closingSlide);
  track.appendChild(frag);

  for (var i = 0; i < TOTAL; i++) {
    var seg = document.createElement('i');
    seg.dataset.index = i;
    var fill = document.createElement('b');
    seg.appendChild(fill);
    seg.addEventListener('click', function () { goTo(parseInt(this.dataset.index, 10)); });
    progressBar.appendChild(seg);
  }
  var segs = progressBar.querySelectorAll('i');

  var current = 0;
  function updateChrome(idx) {
    current = idx;
    counter.textContent = String(idx + 1).padStart(2, '0') + ' / ' + TOTAL;
    segs.forEach(function (seg, i) { seg.classList.toggle('done', i <= idx); });
    slides.forEach(function (s, i) { s.classList.toggle('is-active', i === idx); });
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === TOTAL - 1;
  }

  function goTo(idx) {
    idx = Math.max(0, Math.min(TOTAL - 1, idx));
    slides[idx].scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
  }

  prevBtn.addEventListener('click', function () { goTo(current - 1); });
  nextBtn.addEventListener('click', function () { goTo(current + 1); });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { goTo(current - 1); }
    else if (e.key === 'ArrowRight') { goTo(current + 1); }
  });

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting && e.intersectionRatio > 0.6) {
          updateChrome(slides.indexOf(e.target));
        }
      });
    }, { root: track, threshold: [0.6] });
    slides.forEach(function (s) { io.observe(s); });
  }

  updateChrome(0);
})();
</script>
