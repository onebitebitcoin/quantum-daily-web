# SNS 링크 미리보기 봇은 JS를 실행하지 않아 SPA의 정적 index.html로는 날짜별
# og:title/description/image를 줄 수 없다. 이 UA들만 백엔드가 만든 메타 전용
# HTML(app/og.py)로 보내고, 사람은 그대로 SPA를 받는다.
#
# 주의: "KakaoTalk"만으로 매칭하면 실제 사용자가 카톡 인앱 브라우저로 링크를
# 열었을 때(UA에 "KAKAOTALK x.x.x"가 붙음)도 걸려서, body가 빈 메타 전용
# 페이지가 그대로 노출되며 하얀 화면이 된다. 미리보기 스크랩 봇은 UA에
# "KakaoTalk-Scrap"이 붙으므로 그걸로만 좁혀서 구분한다.
map $http_user_agent $is_social_bot {
    default 0;
    "~*(facebookexternalhit|Facebot|Twitterbot|Slackbot|TelegramBot|KakaoTalk-Scrap|Discordbot|LinkedInBot|WhatsApp|SkypeUriPreview|Applebot|redditbot)" 1;
}

# 호스트 nginx(TLS 종단)가 이미 X-Forwarded-Proto: https를 보냈다면 그대로
# 넘긴다. 이 컨테이너로 직접(로컬 8020 등) 들어와 헤더가 비어 있을 때만
# 이 nginx 자신의 스킴(항상 http)으로 대체한다 — 없으면 og:image/og:url이
# 항상 http://로 굳어버린다(og.py가 이 헤더로 origin을 만든다).
map $http_x_forwarded_proto $proxy_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;

    # 리다이렉트 Location 을 상대 경로로 낸다.
    #
    # 호스트 nginx 가 TLS 를 끊고 127.0.0.1:8021 로 평문 프록시하므로 이 nginx 의
    # $scheme 은 언제나 http 다. 기본값(absolute_redirect on)이면 `return 301 /ai/`
    # 가 http://<host>/ai/ 라는 절대 URL 로 나가고, https 로 들어온 사람이
    #   https://…/  →  http://…/ai/  →  https://…/ai/
    # 로 평문을 한 번 거쳐 간다(2026-08-29 프로덕션에서 실측). 끊기지는 않지만
    # 왕복이 하나 늘고 그 사이 한 홉이 평문이며, HSTS 를 켜면 그 홉이 막힌다.
    # off 로 두면 Location 이 그냥 /ai/ 라 브라우저가 원래 스킴을 유지한다.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 도메인 루트로 들어온 사람은 /ai/ 로 넘긴다. dist 가 html 루트가 아니라 ai/
    # 아래에 있으므로 이 줄이 없으면 루트는 그냥 403/404 다. vite 개발 서버는
    # base 로 자동 리다이렉트해 주므로 로컬에서는 드러나지 않는 구멍이다.
    location = / {
        return 301 /ai/;
    }

    # 이 카드뉴스는 /ai 서브패스에서 서빙한다(frontend/vite.config.ts의 base와 짝)
    # — 도메인 루트는 앞으로 다른 시리즈가 쓸 수 있어 비워 둔다.
    location = /ai {
        return 301 /ai/;
    }

    # proxy_pass에 URI를 붙이는 건 정규식 location/if 안에서 금지되므로, 여기선
    # URI만 /api/og/...로 rewrite해서 아래 기존 /api 프록시 블록이 그대로 처리하게 한다.
    location = /ai/ {
        if ($is_social_bot) {
            rewrite ^ /api/og/latest last;
        }
        try_files /ai/index.html /ai/index.html;
    }

    # 쇼츠 피드는 카드 하나가 공유 단위라 /ai/d/:date/:index 형태의 링크가 돌아다닌다.
    # 카드가 붙은 링크는 그 카드의 메타를, 날짜만 있는 링크는 에디션 메타를 받는다.
    #
    # location을 둘로 나눈 이유: 하나로 두고 비어 있을 수 있는 캡처를 이어 붙이면
    # 날짜만 있는 요청에서 /api/og/{날짜}/ 처럼 슬래시가 남는데, 백엔드는
    # redirect_slashes=False(backend/app/main.py:9)라 그 경로가 404다.
    # 정규식 location은 적힌 순서대로 평가되므로 카드가 붙은 쪽이 먼저 와야 한다.
    location ~ ^/ai/d/(?<ecdate>[^/]+)/(?<ecard>[0-9]+)/?$ {
        if ($is_social_bot) {
            rewrite ^ /api/og/$ecdate/$ecard last;
        }
        try_files /ai/index.html /ai/index.html;
    }
    location ~ ^/ai/d/(?<edate>[^/]+)/?$ {
        if ($is_social_bot) {
            rewrite ^ /api/og/$edate last;
        }
        try_files /ai/index.html /ai/index.html;
    }

    # 백엔드는 redirect_slashes=False(backend/app/main.py:9)라 경로를 손대면 안 된다.
    # proxy_pass에 경로를 붙이지 않으면 원본 URI가 그대로 전달된다.
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # vite가 base:/ai/로 뽑으므로 에셋도 /ai/assets/ 밑에 나온다. 해시 파일명이라
    # 장기 캐시가 안전하다.
    location /ai/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # 자산이 없을 때는 404 를 캐시시키지 않는다. nginx 는 404 에 Cache-Control 을
        # 붙이지 않는데(expires/add_header 는 기본적으로 성공 응답에만 걸린다), 그 빈
        # 자리를 Cloudflare 가 자기 기본값 max-age=14400 으로 채운다. 배포가 잠깐
        # 어긋나 자산이 404 이던 창에 들른 브라우저는 서버가 고쳐진 뒤에도 4 시간 동안
        # 같은 URL 을 404 로 기억해 흰 화면을 본다(2026-08-29 프로덕션 실측 —
        # 하드 리로드한 크롬은 정상, 그냥 다시 연 삼성 인터넷은 계속 흰 화면).
        # 파일명이 콘텐츠 해시라 재빌드해도 URL 이 같아서 캐시가 저절로 비켜나지 않는다.
        try_files $uri @asset_missing;
    }

    # add_header 는 기본적으로 성공 응답에만 붙으므로 404 에 걸려면 always 가 필요하다.
    location @asset_missing {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # SPA fallback — /ai/d/:date, /ai/calendar 직접 진입/새로고침 대응
    # (백엔드에 정적 서빙이나 catch-all이 없으므로 이게 없으면 404가 난다)
    location /ai/ {
        try_files $uri $uri/ /ai/index.html;
    }
}
