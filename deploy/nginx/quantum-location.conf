    # ── quantum-daily-web ──────────────────────────────────────────────
    # **읽기용 사본이다.** 실제로 서버에 들어가는 것은 ai-daily-web 저장소의
    # deploy/nginx/daily.onebitecoder.com.conf 이고, 이 블록은 이미 거기 들어 있다.
    # 호스트 설정을 바꿀 일이 있으면 그 파일을 고친다(README.md 참고).
    #
    # 접두사 location 은 가장 긴 것이 이기므로 `/quantum/...` 은 여기로 오고
    # `/ai/...` 는 같은 블록의 `location /ai` 가 8021 로 보낸다.
    #
    # 컨테이너 web(127.0.0.1:8023)이 정적 서빙·`/quantum/api` 프록시·SPA fallback 을
    # 모두 처리한다. 여기서 경로를 더 나누지 않는 이유는 ai 쪽과 같다 — 백엔드가
    # redirect_slashes=False 라 경로를 손대면 안 되고, SPA fallback 도 컨테이너
    # nginx 의 try_files 한 곳에만 있어야 한다.
    location /quantum {
        proxy_pass http://127.0.0.1:8023;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
